<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full Count — Unit Tests</title>
  <style>
    body { font-family: monospace; background: #0f141c; color: #d0dbe5; padding: 24px; }
  </style>
  <script>
    window.onerror = function(msg, url, line) {
      document.body.innerHTML += '<h1 style="color:red">ERROR: ' + msg + ' LINE: ' + line + '</h1>';
    };
  </script>
</head>


<body>
  <h1>Full Count — Unit Test Runner</h1>
  <div id="results"></div>
  <div id="summary" class="summary">Running tests...</div>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/resolution.js"></script>

  <script>
    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');
    let passed = 0;
    let failed = 0;

    function assert(condition, message) {
      const p = document.createElement('p');
      if (condition) {
        passed++;
        p.className = 'pass';
        p.textContent = `[PASS] ${message}`;
      } else {
        failed++;
        p.className = 'fail';
        p.textContent = `[FAIL] ${message}`;
        console.error(`Assertion failed: ${message}`);
      }
      resultsEl.appendChild(p);
    }

    function runTests() {
      try {
        // 1. Data Integrity Tests
        const actionCardKeys = Object.keys(ACTION_CARDS || {});
        const pitcherCharKeys = Object.keys(PITCHER_CHARACTERS || {});
        const batterCharKeys = Object.keys(BATTER_CHARACTERS || {});
        const deckPresetKeys = Object.keys(DECK_PRESETS || {});

        assert(actionCardKeys.length === 70, `Action cards loaded (70 cards total, found ${actionCardKeys.length})`);
        assert(pitcherCharKeys.length === 8, `8 Pitcher characters loaded (found ${pitcherCharKeys.length})`);
        assert(batterCharKeys.length === 12, `12 Batter characters loaded (found ${batterCharKeys.length})`);
        assert(deckPresetKeys.length === 3, `3 Preset decks loaded (found ${deckPresetKeys.length})`);

        // 2. Pure Number Cards: Full value everywhere
        const fourSeam = getCard('P1');
        assert(fourSeam && fourSeam.value === 10, `P1 card exists with value 10`);
        assert(getZoneValue(fourSeam, 'z1') === 10, `P1 retains full value 10 in Beat 1`);
        assert(getZoneValue(fourSeam, 'z2') === 10, `P1 retains full value 10 in Beat 2 without penalty`);

        const allPureNumberCards = Object.values(ACTION_CARDS).every(c => typeof c.value === 'number' && !c.powerBadge && !c.outcomeEffect);
        assert(allPureNumberCards, `All 70 cards are pure number cards with no modifiers or bonuses`);


        // 3. sumZone
        const totalZ1 = sumZone(['P1', 'P2'], 'z1');
        assert(totalZ1 === getZoneValue(getCard('P1'), 'z1') + getZoneValue(getCard('P2'), 'z1'), `sumZone correctly sums card values (${totalZ1})`);

        // 4. Base Running Helpers
        assert(countRunners({ first: true, second: false, third: true }) === 2, `countRunners returns 2 for 1st & 3rd`);
        assert(countRunners({ first: false, second: false, third: false }) === 0, `countRunners returns 0 for empty bases`);

        const baseHitRuns = runsOnHit({ first: true, second: true, third: true }, 1);
        assert(baseHitRuns === 1, `Single with bases loaded scores 1 run`);

        const doubleRuns = runsOnHit({ first: true, second: true, third: true }, 2);
        assert(doubleRuns === 2, `Double with bases loaded scores 2 runs`);

        const basesAfterSingle = advanceBases({ first: true, second: false, third: false }, 1);
        assert(basesAfterSingle.first === true && basesAfterSingle.second === true && basesAfterSingle.third === false,
          `Single with runner on 1st moves runners to 1st & 2nd`);

        // 5. Pure Number Cards - No Counter Multipliers
        const b1Card = getCard('B1');
        const p1Card = getCard('P1');
        assert(b1Card && b1Card.value === 2, `B1 card is pure number with value 2`);
        assert(p1Card && p1Card.value === 10, `P1 card is pure number with value 10`);
        assert(!b1Card.counters && !p1Card.pitchCall, `Cards contain no counters or pitchCall modifiers`);


        // 6. Pitcher Stamina Degradation
        const acePitcher = PITCHER_CHARACTERS['PC01']; // Cole Vance
        const freshMod = getStaminaMod(acePitcher, 0);
        const tiredMod = getStaminaMod(acePitcher, 20);
        assert(freshMod.z1 === 0 && freshMod.z2 === 0 && freshMod.z3 === 0, `Fresh pitcher stamina mod has no penalties`);
        assert(tiredMod.z1 < 0 || tiredMod.z2 < 0, `Exhausted pitcher has stamina penalties (z1: ${tiredMod.z1}, z2: ${tiredMod.z2})`);

        // 7. Full PA Resolution
        const paResult = resolvePA({
          pitcherPlacement: { z1: ['P1'], z2: ['P13'], z3: ['P23'] },
          batterPlacement:  { z1: ['B1'], z2: ['B11'], z3: ['B21'] },
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar:  BATTER_CHARACTERS['BC01'],
          pitcherPAsFaced: 0,
          bases: { first: false, second: false, third: false },
          isFirstPAOfInning: true,
          prevPitchCall: null,
          score: { batting: 0, pitching: 0 },
          outs: 0,
          inning: 1,
          totalInnings: 3,
          pitcherWonZ1LastPA: false,
        });

        assert(paResult && paResult.outcome && paResult.outcome.type, `resolvePA returns valid outcome (${paResult?.outcome?.display})`);
        assert(Array.isArray(paResult.log) && paResult.log.length > 0, `resolvePA produces play-by-play log with ${paResult?.log?.length} entries`);
        assert(paResult.outcome.rng && typeof paResult.outcome.rng.tier === 'string', `resolvePA provides RNG tier breakdown (${paResult.outcome.rng.tier})`);
        assert(Array.isArray(paResult.z1.pitcherCards) && Array.isArray(paResult.z1.batterCards), `resolvePA records cards in Zone 1`);
        assert(paResult.z2.cascadeEffect !== undefined, `resolvePA records cascade effect from Zone 2 (${paResult.z2.cascadeEffect})`);
        assert(paResult.zonesWon && typeof paResult.zonesWon.batter === 'number', `resolvePA records zone tally (batter: ${paResult.zonesWon.batter}, pitcher: ${paResult.zonesWon.pitcher})`);

        // 8. Practice Bot Placement Tests
        const pitcherBotHand = ['P1', 'P13', 'P23']; // Fastball (read/z1), Extra Heat (contact/z2), Infield Shift (result/z3)
        const botPitchState = { half: 'bottom', hands: { guest: [...pitcherBotHand] } }; // bottom = guest pitches
        const botPitchPlay = executeBotPlay(botPitchState, 'guest');
        assert(botPitchPlay.botPlacement.z1.includes('P1'), `Pitcher bot plays pitch card P1 in Zone 1`);
        assert(botPitchPlay.botPlacement.z2.includes('P13') || botPitchPlay.botPlacement.z3.includes('P23'), `Pitcher bot plays supporting card in Z2 or Z3`);
        assert(botPitchPlay.botHand.length < pitcherBotHand.length, `Pitcher bot removes played cards from hand (remaining: ${botPitchPlay.botHand.length})`);

        const batterBotHand = ['B1', 'B13', 'B23'];
        const botBatState = { half: 'top', hands: { guest: [...batterBotHand] } }; // top = guest bats
        const botBatPlay = executeBotPlay(botBatState, 'guest');
        assert(botBatPlay.botPlacement.z2.length > 0, `Batter bot plays card in Zone 2`);
        assert(botBatPlay.botHand.length < batterBotHand.length, `Batter bot removes played cards from hand (remaining: ${botBatPlay.botHand.length})`);


        const emptyBotPlay = executeBotPlay({ half: 'top', hands: { guest: [] } }, 'guest');
        assert(emptyBotPlay.botPlacement.z1.length === 0 && emptyBotPlay.botPlacement.z2.length === 0, `Bot handles empty hand gracefully without error`);

        // 9. Role-Appropriate Preset Decks
        Object.entries(DECK_PRESETS).forEach(([key, preset]) => {
          assert(Array.isArray(preset.pitcherCards) && preset.pitcherCards.length >= 10, `Preset ${key} has pitcherCards array (${preset.pitcherCards?.length} cards)`);
          assert(Array.isArray(preset.batterCards) && preset.batterCards.length >= 10, `Preset ${key} has batterCards array (${preset.batterCards?.length} cards)`);

          const pHasNoBatter = preset.pitcherCards.every(id => getCard(id)?.type !== 'batter');
          assert(pHasNoBatter, `Preset ${key} pitcherCards contains zero batter cards`);

          const bHasNoPitcher = preset.batterCards.every(id => getCard(id)?.type !== 'pitcher');
          assert(bHasNoPitcher, `Preset ${key} batterCards contains zero pitcher cards`);
        });

        // 10. Card Simplification
        const cardsWithLegacyProps = Object.values(ACTION_CARDS).filter(c => c.z3CounterOf || c.z3CounteredBy || c.self_z2_penalty || c.penalty);
        assert(cardsWithLegacyProps.length === 0, `All action cards are simplified with no legacy cross-zone penalty fields (found ${cardsWithLegacyProps.length})`);

        // 11. Pitcher Repertoire Integrity
        Object.values(PITCHER_CHARACTERS).forEach(p => {
          assert(p.repertoire && typeof p.repertoire.fastball === 'number', `Pitcher ${p.name} has repertoire`);
          const totalPitches = (p.repertoire.fastball || 0) + (p.repertoire.breaking || 0) + (p.repertoire.offspeed || 0);
          assert(totalPitches === 9, `Pitcher ${p.name} has exactly 9 pitch charges (${totalPitches})`);
        });

        // 12. Sequential Beat 1 Tests (Count Battle & Economy)
        // Pitcher P1 (val 10) vs Batter B13 (val 1) -> Dominant 0-2 Pitcher Count (margin 9 >= 5)
        const b1PitcherWins = resolveBeat1({
          pitcherCardId: 'P1',
          batterCardId: 'B13',
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b1PitcherWins.winner === 'pitcher', `Beat 1 higher pitcher card awards pitcher advantage`);
        assert(b1PitcherWins.count === '0-2', `Beat 1 pitcher win establishes 0-2 Pitcher's Count`);
        assert(b1PitcherWins.lockedOption === 'power', `Pitcher win locks out batter Power swing`);
        assert(b1PitcherWins.isDominant === true, `Margin 9 establishes dominant count advantage`);
        assert(b1PitcherWins.revealCardFirst === 'batter', `Batter must play execution card face-up first on dominant pitcher win`);

        // Batter B6 (val 9) vs Pitcher P6 (val 2) -> Dominant 3-1 Hitter Count (margin 7 >= 5)
        const b1BatterWins = resolveBeat1({
          pitcherCardId: 'P6',
          batterCardId: 'B6',
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b1BatterWins.winner === 'batter', `Beat 1 higher batter card awards batter advantage`);
        assert(b1BatterWins.count === '3-1', `Beat 1 batter win establishes 3-1 Hitter's Count`);
        assert(b1BatterWins.lockedOption === 'offspeed', `Batter win locks out pitcher Offspeed pitch`);
        assert(b1BatterWins.isDominant === true, `Margin 7 establishes dominant count advantage`);
        assert(b1BatterWins.revealCardFirst === 'pitcher', `Pitcher must throw execution card face-up first on dominant batter win`);

        // Simple Win (margin 1): P14 (val 6) vs B17 (val 5) -> 0-2 Count without card reveal
        const b1Simple = resolveBeat1({
          pitcherCardId: 'P14',
          batterCardId: 'B17',
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b1Simple.winner === 'pitcher', `Simple win awards pitcher win`);
        assert(b1Simple.lockedOption === 'power', `Simple win still locks out batter Power swing`);
        assert(b1Simple.isDominant === false, `Margin 1 is simple win, not dominant`);
        assert(b1Simple.revealCardFirst === null, `Simple win does not force card reveal`);

        // Tie: P23 (val 5) vs B17 (val 5) -> 3-2 Full Count
        const b1Tie = resolveBeat1({
          pitcherCardId: 'P23',
          batterCardId: 'B17',
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b1Tie.winner === 'tie', `Beat 1 equal cards results in tie`);
        assert(b1Tie.count === '3-2', `Beat 1 tie establishes 3-2 Full Count`);
        assert(b1Tie.lockedOption === null, `3-2 Full count has no option lockouts`);
        assert(b1Tie.isDominant === false, `Tie has no dominant advantage`);
        assert(b1Tie.revealCardFirst === null, `Tie does not force card reveal`);

        // 13. Sequential Beat 2 Tests (Timing Delta & Deduction Clash)
        // Scenario A: PITCH ANTICIPATED (Effective Guess matches Pitch Type)
        // Pitcher Fastball (P14 val 6 in 6-10), Batter times Fastball (B26 val 6 in 6-10) -> Delta 0 (Squared Up Barrel!)
        const b2HR = resolveBeat2({
          count: '3-2',
          pitchType: 'fastball',
          pitcherCardId: 'P14', // val 6 in 6-10
          guessPitch: 'fastball',
          batterCardId: 'B26',  // val 6 in 6-10 -> Delta 0!
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2HR.pitcherExecuted === true, `Pitcher executes fastball in range 6-10 (6)`);
        assert(b2HR.batterExecuted === true, `Batter executes timing in anticipated pitch range 6-10 (6)`);
        assert(b2HR.timingDelta === 0, `Timing Delta is 0 (Squared Up Barrel)`);
        assert(b2HR.matchTier === 'matched', `Batter anticipated pitch (match)`);
        assert(b2HR.outcomeType === 'homerun', `Pitch match + Delta 0 barrel produces Home Run`);

        // Pitch Match with off-balance timing: Contact hitter had pitch read, gets routine out
        const b2FullContactMistimed = resolveBeat2({
          count: '3-2',
          pitchType: 'fastball',
          pitcherCardId: 'P14', // val 6, PC01 has +5 FB -> eff = 11
          guessPitch: 'fastball',
          batterCardId: 'B17',  // val 5, BC02 has +2 FB -> eff = 7 (Timing Delta: |11 - 7| = 4)
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC02'],
        });
        assert(b2FullContactMistimed.matchTier === 'matched', `Pitch match on timing stroke`);
        assert(b2FullContactMistimed.timingDelta === 4, `Timing Delta is 4 (off-balance contact)`);
        assert(b2FullContactMistimed.outcomeType === 'flyout' || b2FullContactMistimed.outcomeType === 'groundout', `Pitch match off-balance contact produces routine out`);

        // Scenario B: PITCH ANTICIPATED - SOLID TIMING & CLEAN HIT
        // Pitcher breaking ball (P14 val 6 + 3 = 9), Batter times breaking ball (B2 val 8 + 2 = 10, Delta 1)
        // Solid line drive on anticipated pitch produces single
        const b2SolidHit = resolveBeat2({
          count: '3-2',
          pitchType: 'breaking',
          pitcherCardId: 'P14', // val 6 + 3 = 9
          guessPitch: 'breaking',
          batterCardId: 'B2',   // val 8 + 2 = 10, Delta 1
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2SolidHit.matchTier === 'matched', `Batter read the breaking ball`);
        assert(b2SolidHit.timingDelta === 1, `Timing Delta is 1 (solid line drive)`);
        assert(b2SolidHit.outcomeType === 'single', `Solid line drive on anticipated pitch produces single`);

        // Pitch Anticipated but badly mistimed (Delta 5+) -> Strikeout
        const b2Strikeout = resolveBeat2({
          count: '3-2',
          pitchType: 'fastball',
          pitcherCardId: 'P14', // val 6 + 5 = 11
          guessPitch: 'fastball',
          batterCardId: 'B14',  // val 2 + 2 = 4 (Delta |11 - 4| = 7 >= 5)
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC02'],
        });
        assert(b2Strikeout.timingDelta >= 5, `Timing Delta is 5+ (badly mistimed)`);
        assert(b2Strikeout.outcomeType === 'k', `Badly mistimed card even on read pitch results in Strikeout`);

        // Scenario C: FOOLED / WHIFF (Batter guessed wrong pitch)
        // Contact hitter manages to put ball in play with solid timing (Delta <= 2)
        const b2ContactProtect = resolveBeat2({
          count: '3-2',
          pitchType: 'breaking', // PC01 Breaking bonus = 3
          pitcherCardId: 'P7',   // val 3 -> eff = 6
          guessPitch: 'fastball', // Pitch wrong (+0)
          batterCardId: 'B17',   // val 5 -> eff = 5 -> Delta |6 - 5| = 1 <= 2
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC02'], // Contact Hitter archetype
        });
        assert(b2ContactProtect.matchTier === 'whiff', `Batter guessed wrong pitch`);
        assert(b2ContactProtect.timingDelta === 1, `Timing Delta is 1`);
        assert(b2ContactProtect.outcomeType === 'groundout', `Contact hitter avoids strikeout, producing groundout`);

        // Whiff with close card collision (Delta 0) -> Popout/Groundout
        const b2WhiffGoodSwing = resolveBeat2({
          count: '3-2',
          pitchType: 'breaking', // PC01 Breaking bonus = 3
          pitcherCardId: 'P14', // Val 6 -> eff = 9
          guessPitch: 'fastball', // WRONG (+0)
          batterCardId: 'B18',  // Val 9 -> eff = 9 (Delta 0 collision, but fooled on pitch!)
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2WhiffGoodSwing.matchTier === 'whiff', `Batter guessed wrong pitch`);
        assert(b2WhiffGoodSwing.timingDelta === 0, `Timing Delta is 0`);
        assert(b2WhiffGoodSwing.outcomeType === 'flyout' || b2WhiffGoodSwing.outcomeType === 'groundout', `Fooled batter cannot hit HR even on barrel collision (produces popout/groundout)`);

        // Whiff when pitcher executes clean and timing is off (Delta 3) -> Swinging Strikeout!
        const b2WhiffCleanPitch = resolveBeat2({
          count: '3-2',
          pitchType: 'breaking', // PC01 Breaking bonus = 3
          pitcherCardId: 'P14', // Val 6 -> eff = 9
          guessPitch: 'fastball', // WRONG (+0)
          batterCardId: 'B11',  // Val 6 -> eff = 6 (Delta 3)
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2WhiffCleanPitch.matchTier === 'whiff', `Batter fooled on pitch`);
        assert(b2WhiffCleanPitch.timingDelta === 3, `Timing Delta is 3`);
        assert(b2WhiffCleanPitch.outcomeType === 'k', `Fooled on pitch with off-timing produces Strikeout`);

        // ── SPECIAL CARDS TESTS: WP (Wild Pitch) & K (Automatic Strikeout) ──
        // Pitcher plays WP (Card 1) on 0-2 count
        const b2WildPitch02 = resolveBeat2({
          count: '0-2',
          pitchType: 'fastball',
          pitcherCardId: 'P19', // Val 1 (WP!)
          guessPitch: 'offspeed',
          batterCardId: 'B4',   // Val 3
          bases: { first: true, second: false, third: true },
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2WildPitch02.isPitcherWP === true, `Pitcher Card 1 is identified as WP (Wild Pitch)`);
        assert(b2WildPitch02.outcomeType === 'wild_pitch', `WP on 0-2 count resolves to wild_pitch`);
        assert(b2WildPitch02.isWildPitchReset === true, `isWildPitchReset is flagged true on 0-2 wild pitch`);
        assert(b2WildPitch02.outsAdded === 0, `Wild pitch adds zero outs`);
        assert(b2WildPitch02.runsScored === 1, `Runner on 3rd scores on wild pitch`);
        assert(b2WildPitch02.ruleReason.includes('Wild pitch') || b2WildPitch02.ruleReason.includes('wild pitch'), `Rule reason describes wild pitch in dirt`);

        // Batter plays K (Card 1) -> Automatic Strikeout!
        const b2BatterK = resolveBeat2({
          count: '3-1',
          pitchType: 'fastball',
          pitcherCardId: 'P2',  // Val 9
          guessPitch: 'fastball',
          batterCardId: 'B13',  // Val 1 (K!)
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2BatterK.isBatterK === true, `Batter Card 1 is identified as K (Strikeout)`);
        assert(b2BatterK.outcomeType === 'k', `Batter K card produces automatic Strikeout`);

        // Both players play Card 1 -> Strikeout on Wild Pitch!
        const b2Both1 = resolveBeat2({
          count: '0-2',
          pitchType: 'fastball',
          pitcherCardId: 'P19', // Val 1 (WP)
          guessPitch: 'fastball',
          batterCardId: 'B13',  // Val 1 (K)
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2Both1.outcomeType === 'k', `Both Card 1s records Strikeout`);
        assert(b2Both1.isWildPitchReset === true, `Both Card 1s advances runners on the wild pitch`);

        // 3-1 Count Executed Pitch Whiff Test (Option 1: Strikeout, Never Walk)
        // Pitcher executes Fastball [6-10] with Card P22 (val 9).
        // Batter anticipates Fastball with Card B4 (val 3). Delta = 6 (Badly Mistimed Whiff).
        const b2Executed31AnticipatedWhiff = resolveBeat2({
          count: '3-1',
          pitchType: 'fastball',
          pitcherCardId: 'P22', // Val 9 (executed strike in 6-10)
          guessPitch: 'fastball', // Anticipated
          batterCardId: 'B4',   // Val 3 (Delta 6 whiff)
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2Executed31AnticipatedWhiff.pitcherExecuted === true, `Pitcher executed Fastball with Card 9`);
        assert(b2Executed31AnticipatedWhiff.timingDelta === 6, `Timing Delta is 6 (whiff)`);
        assert(b2Executed31AnticipatedWhiff.outcomeType === 'k', `Executed strike with Delta 6 whiff on 3-1 count is Strikeout, NEVER Walk`);
        assert(b2Executed31AnticipatedWhiff.outcomeType !== 'walk', `Executed strike cannot be a Walk`);

        // 3-1 Count Executed Pitch Fooled Whiff Test:
        // Pitcher executes Fastball [6-10] with Card P22 (val 9).
        // Batter fooled looking Offspeed with Card B4 (val 3). Delta = 6.
        const b2Executed31FooledWhiff = resolveBeat2({
          count: '3-1',
          pitchType: 'fastball',
          pitcherCardId: 'P22', // Val 9 (executed strike in 6-10)
          guessPitch: 'offspeed', // Fooled
          batterCardId: 'B4',   // Val 3 (Delta 6)
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2Executed31FooledWhiff.outcomeType === 'k', `Executed strike with Delta 6 fooled whiff on 3-1 count is Strikeout, NEVER Walk`);
        assert(b2Executed31FooledWhiff.outcomeType !== 'walk', `Fooled whiff on executed strike cannot be a Walk`);

        // 3-1 Count Unexecuted Pitch Test:
        // Pitcher fails execution throwing Fastball with Card P30 (val 1, out of range 6-10).
        // Batter is fooled on pitch type. Unexecuted ball on 3-1 is Ball Four -> Walk!
        const b2Unexecuted31Walk = resolveBeat2({
          count: '3-1',
          pitchType: 'fastball',
          pitcherCardId: 'P30', // Val 1 (out of range 6-10)
          guessPitch: 'breaking', // Fooled
          batterCardId: 'B4',
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(!b2Unexecuted31Walk.pitcherExecuted, `Pitcher failed execution with Card 1 on Fastball`);
        assert(b2Unexecuted31Walk.outcomeType === 'walk', `Unexecuted pitch on 3-1 count properly resolves to Walk (Ball Four)`);



        // 14. Character Base Pitch Ratings Tests
        assert(typeof getPitcherPitchRating === 'function', 'getPitcherPitchRating helper is defined');
        assert(typeof getBatterPitchRating === 'function', 'getBatterPitchRating helper is defined');
        const pSmoke = PITCHER_CHARACTERS['PC04']; // Smoke Williams
        const bBear = BATTER_CHARACTERS['BC01'];   // The Bear Mackintosh
        assert(getPitcherPitchRating(pSmoke, 'fastball') === 6, 'Smoke Williams has +6 Fastball rating');
        assert(getPitcherPitchRating(pSmoke, 'breaking') === 3, 'Smoke Williams has +3 Breaking rating');
        assert(getBatterPitchRating(bBear, 'fastball') === 5, 'The Bear Mackintosh has +5 Fastball rating');
        assert(getBatterPitchRating(bBear, 'breaking') === 2, 'The Bear Mackintosh has +2 Breaking rating');

        // 15. Beat 2 Battle-Back Condition Tests
        // 0-2 Count: Batter makes solid Delta 2 contact on read pitch -> Battles back to 3-2!
        const b2BattleBack02 = resolveBeat2({
          count: '0-2',
          pitchType: 'fastball',
          pitcherCardId: 'P13', // Val 7 + Smoke +6 = 13
          guessPitch: 'fastball',
          batterCardId: 'B26',  // Val 6 + Bear +5 = 11 (Timing Delta: |13 - 11| = 2)
          pitcherChar: pSmoke,
          batterChar: bBear,
        });
        assert(b2BattleBack02.isBattleBack === true, '0-2 Count with solid Delta 2 contact triggers battle back');
        assert(b2BattleBack02.outcomeType === 'battle_back', '0-2 Battle back outcomeType is battle_back');
        assert(b2BattleBack02.pitcherEffectiveVal === 13, `Pitcher effective value calculated correctly (${b2BattleBack02.pitcherEffectiveVal} == 13)`);
        assert(b2BattleBack02.batterEffectiveVal === 11, `Batter effective value calculated correctly (${b2BattleBack02.batterEffectiveVal} == 11)`);

        // 3-1 Count: Pitcher throws clutch strike on Delta 3-4 -> Battles back to 3-2!
        const b2BattleBack31 = resolveBeat2({
          count: '3-1',
          pitchType: 'fastball',
          pitcherCardId: 'P2',  // Val 9 (in range 6-10)
          guessPitch: 'fastball',
          batterCardId: 'B11', // Val 6 (in range 6-10, Timing Delta: |9 - 6| = 3)
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b2BattleBack31.isBattleBack === true, '3-1 Count with clutch strike Delta 3 triggers battle back');
        assert(b2BattleBack31.outcomeType === 'battle_back', '3-1 Battle back outcomeType is battle_back');

        // 16. Beat 3 Full Count Showdown (resolveBeat3) Tests
        const b3ShowdownHR = resolveBeat3({
          pitchType: 'fastball',
          pitcherCardId: 'P8',  // Val 6 + Smoke +6 = 12
          guessPitch: 'fastball',
          batterCardId: 'B29', // Val 10 + Bear +5 = 15 (Margin: 15 - 12 = +3, Slugger bonus -> HR)
          pitcherChar: pSmoke,
          batterChar: bBear,
        });
        assert(b3ShowdownHR.outcomeType === 'homerun', `3-2 Full Count showdown barreled by slugger produces Home Run (${b3ShowdownHR.outcomeType})`);
        assert(b3ShowdownHR.count === '3-2', 'Beat 3 count is 3-2');

        const b3ShowdownWalk = resolveBeat3({
          pitchType: 'fastball',
          pitcherCardId: 'P13', // Val 7 + Smoke +6 = 13
          guessPitch: 'fastball',
          batterCardId: 'B2',  // Val 8 + Bear +5 = 13 (Margin: 0 -> Ball Four Walk)
          pitcherChar: pSmoke,
          batterChar: bBear,
        });
        assert(b3ShowdownWalk.outcomeType === 'walk', `3-2 Full Count showdown standoff (Margin 0) produces Walk`);

        const b3ShowdownStrikeout = resolveBeat3({
          pitchType: 'breaking',
          pitcherCardId: 'P2',  // Val 9
          guessPitch: 'fastball', // Fooled on pitch type
          batterCardId: 'B1',  // Val 2
          pitcherChar: PITCHER_CHARACTERS['PC01'],
          batterChar: BATTER_CHARACTERS['BC01'],
        });
        assert(b3ShowdownStrikeout.outcomeType === 'k', `3-2 Full Count showdown fooled low card produces Strikeout`);

        // 17. Sequential 3-Beat PA Resolution
        const seq3BeatResult = resolveSequentialPA({
          beat1: b1PitcherWins,
          beat2: b2BattleBack02,
          beat3: b3ShowdownHR,
          bases: { first:false, second:false, third:false },
          pitcherChar: pSmoke,
          batterChar: bBear,
          score: { batting:0, pitching:0 },
          outs: 0,
          half: 'top'
        });
        assert(seq3BeatResult && seq3BeatResult.z3 !== undefined, 'Sequential PA preserves Beat 3 outcome in z3');
        assert(seq3BeatResult.outcome.type === 'homerun', 'Final PA outcome is governed by Beat 3 result');

        // 18. Beat-Specific Solo Bot Decision Tests
        const botState = {
          half: 'top',
          arsenalCharges: { host: { fastball: 4, breaking: 2, offspeed: 1 } },
          hands: { guest: ['B1', 'B11', 'B21'] }
        };
        const botBeat1 = executeBotPlayBeat(botState, 'guest', 'beat1');
        assert(botBeat1.cardId !== null, `Bot selects card for Beat 1 Count battle (${botBeat1.cardId})`);

        const botBeat2 = executeBotPlayBeat(botState, 'guest', 'beat2');
        assert(botBeat2.guessPitch !== null, `Bot anticipates pitch for Beat 2 (${botBeat2.guessPitch})`);
        assert(botBeat2.cardId !== null, `Bot selects card for Beat 2 execution (${botBeat2.cardId})`);

        const botBeat3 = executeBotPlayBeat(botState, 'guest', 'beat3');
        assert(botBeat3.guessPitch !== null, `Bot anticipates pitch for Beat 3 showdown (${botBeat3.guessPitch})`);
        assert(botBeat3.cardId !== null, `Bot selects card for Beat 3 showdown (${botBeat3.cardId})`);

        // 16. Full 3-Inning Sequential 2-Beat Game Simulation
        const simState = {
          inning: 1,
          half: 'top',
          outs: 0,
          score: { top: 0, bottom: 0 },
          bases: { first: false, second: false, third: false },
          batterIndex: { top: 0, bottom: 0 },
          activePitcher: { host: 'PC01', guest: 'PC02' },
          pitcherPAs: { host: 0, guest: 0 },
          lastPitchCall: { host: null, guest: null },
          arsenalCharges: {
            host: { ...PITCHER_CHARACTERS['PC01'].repertoire },
            guest: { ...PITCHER_CHARACTERS['PC02'].repertoire }
          },
          hands: {
            host: ['P1', 'P11', 'P21', 'P2', 'P12'],
            guest: ['B1', 'B11', 'B21', 'B2', 'B12']
          }
        };

        const rosters = {
          host: { startingPitcher: 'PC01', reliefPitcher: 'PC07', lineup: LINEUP_PRESETS.sluggers.lineup, deckPreset: 'grind' },
          guest: { startingPitcher: 'PC02', reliefPitcher: 'PC08', lineup: LINEUP_PRESETS.balanced.lineup, deckPreset: 'grind' }
        };

        let totalPAs = 0;
        let gameEnded = false;

        while (!gameEnded && totalPAs < 120) {
          totalPAs++;
          const half = simState.half;
          const pitchingRole = half === 'top' ? 'host' : 'guest';
          const battingRole = half === 'top' ? 'guest' : 'host';
          const pitcherChar = PITCHER_CHARACTERS[simState.activePitcher[pitchingRole]];
          const battingLineup = rosters[battingRole].lineup;
          const bIdx = simState.batterIndex[half] % battingLineup.length;
          const batterChar = BATTER_CHARACTERS[battingLineup[bIdx]] || BATTER_CHARACTERS['BC01'];

          // Bot plays for both sides in simulation
          const pitchDecision = executeBotPlayBeat(simState, pitchingRole, 'beat1');
          const batDecision = executeBotPlayBeat(simState, battingRole, 'beat1');
          simState.hands[pitchingRole] = pitchDecision.botHand;
          simState.hands[battingRole] = batDecision.botHand;

          // Beat 1: The Count
          const b1 = resolveBeat1({
            pitcherCardId: pitchDecision.cardId,
            batterCardId: batDecision.cardId,
            pitcherChar,
            batterChar,
            pitcherPAsFaced: simState.pitcherPAs[pitchingRole],
            isFirstPAOfInning: simState.outs === 0
          });

          // Beat 2: The Payoff Pitch
          const pitcherPlay = executeBotPlayBeat(simState, pitchingRole, 'beat2');
          simState.hands[pitchingRole] = pitcherPlay.botHand;
          const batterPlay = executeBotPlayBeat(simState, battingRole, 'beat2');
          simState.hands[battingRole] = batterPlay.botHand;

          // Deduct pitch charge
          const chosenPitch = pitcherPlay.pitchType || 'fastball';
          if (simState.arsenalCharges[pitchingRole][chosenPitch] > 0) {
            simState.arsenalCharges[pitchingRole][chosenPitch]--;
          }

          const b2 = resolveBeat2({
            count: b1.count,
            beat1Winner: b1.winner,
            z1Winner: b1.winner,
            pitchType: pitcherPlay.pitchType || 'fastball',
            pitcherCardId: pitcherPlay.cardId,
            guessPitch: batterPlay.guessPitch || 'fastball',
            batterCardId: batterPlay.cardId,
            pitcherChar,
            batterChar,
            pitcherPAsFaced: simState.pitcherPAs[pitchingRole],
            bases: simState.bases,
            outs: simState.outs,
            score: { batting: simState.score[half], pitching: simState.score[half==='top'?'bottom':'top'] },
            pitcherAdvantagePerk: b1.pitcherAdvantagePerk,
            batterAdvantagePerk: b1.batterAdvantagePerk,
          });

          let b3 = null;
          if (b2.isBattleBack) {
            simState.currentPA = { beatResults: { beat1: b1, beat2: b2 } };
            const pitcherPlay3 = executeBotPlayBeat(simState, pitchingRole, 'beat3');
            simState.hands[pitchingRole] = pitcherPlay3.botHand;
            const batterPlay3 = executeBotPlayBeat(simState, battingRole, 'beat3');
            simState.hands[battingRole] = batterPlay3.botHand;

            const chosenPitch3 = pitcherPlay3.pitchType || 'fastball';
            if (simState.arsenalCharges[pitchingRole][chosenPitch3] > 0) {
              simState.arsenalCharges[pitchingRole][chosenPitch3]--;
            }

            b3 = resolveBeat3({
              pitchType: pitcherPlay3.pitchType || 'fastball',
              pitcherCardId: pitcherPlay3.cardId,
              guessPitch: batterPlay3.guessPitch || 'fastball',
              batterCardId: batterPlay3.cardId,
              pitcherChar,
              batterChar,
              bases: simState.bases,
              outs: simState.outs,
              score: { batting: simState.score[half], pitching: simState.score[half==='top'?'bottom':'top'] },
            });
          }

          const paResult = resolveSequentialPA({
            beat1: b1,
            beat2: b2,
            beat3: b3,
            bases: simState.bases,
            pitcherChar,
            batterChar,
            score: { batting: simState.score[half], pitching: simState.score[half==='top'?'bottom':'top'] },
            outs: simState.outs,
            half
          });

          // Apply PA outcome
          const outcome = paResult.outcome;
          simState.outs += outcome.outsAdded || 0;
          simState.bases = outcome.newBases || simState.bases;
          simState.score[half] += outcome.runsScored || 0;
          simState.batterIndex[half]++;
          simState.pitcherPAs[pitchingRole]++;
          simState.lastPitchCall[pitchingRole] = paResult.primaryPitchCall;

          // Inning transition check
          if (simState.outs >= 3) {
            simState.outs = 0;
            simState.bases = { first: false, second: false, third: false };
            if (simState.half === 'top') {
              simState.half = 'bottom';
            } else {
              simState.half = 'top';
              simState.inning++;
            }

            if (simState.inning > 3) {
              gameEnded = true;
            }
          }

          // Refill simulated hands if low or role switched
          ['host', 'guest'].forEach(r => {
            const isPitcher = (r === pitchingRole);
            const deck = isPitcher ? DECK_PRESETS.grind.pitcherCards : DECK_PRESETS.grind.batterCards;
            if (!simState.hands[r] || simState.hands[r].length < 3 || simState.hands[r].some(id => getCard(id)?.type !== 'universal' && getCard(id)?.type !== (isPitcher ? 'pitcher' : 'batter'))) {
              simState.hands[r] = [...deck];
            }
          });
        }

        assert(gameEnded, `Simulated full 3-inning game completed successfully in ${totalPAs} PAs (Final: Host ${simState.score.bottom}, Guest ${simState.score.top})`);
        assert(totalPAs >= 18, `Simulation played at least 18 plate appearances (${totalPAs} PAs played)`);

      } catch (err) {
        assert(false, `Unexpected exception in test suite: ${err.message}`);
      }

      // Summary
      summaryEl.textContent = `Completed: ${passed} passed, ${failed} failed.`;
      summaryEl.className = failed === 0 ? 'summary pass' : 'summary fail';
      window.testResults = { passed, failed };
    }

    runTests();
  </script>
