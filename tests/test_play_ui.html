<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Play UI</title>
  <link rel="stylesheet" href="../fullcount.css">
  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.body.innerHTML += `<p class="fail">[SYNTAX/SCRIPT ERROR] ${msg} at line ${line} in ${url}</p>`;
    };
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="test-results"></div>

  <!-- Mock Firebase -->
  <script>
    window._isDevPreview = true;
    window.myRole = 'host';
    window.gameId = 'SOLO99';
    window.myUid = 'test123';
  </script>
  <script src="../js/data.js"></script>
  <script src="../js/resolution.js"></script>
  <script src="../js/app.js"></script>

  <script>

    try {
      // 1. Test roster state
      const soloRosterState = {
        code: 'SOLO99',
        phase: 'roster',
        host: { uid: 'test123', name: 'Player 1' },
        guest: { uid: 'bot123', name: 'Practice Bot 🤖', isBot: true },
        isSolo: true,
        rosters: { host: null, guest: null },
        gameState: null,
        currentPA: null
      };

      console.log('Testing handleGameState(soloRosterState)...');
      // handleGameState(soloRosterState);

      // 2. Test play state
      const hostStarter = PITCHER_CHARACTERS['PC01'];
      const guestStarter = PITCHER_CHARACTERS['PC02'];
      const hostHand = ['P1', 'P2', 'P11', 'P12', 'P21'];
      const guestHand = ['B1', 'B2', 'B11', 'B12', 'B21'];

      const soloPlayState = {
        code: 'SOLO99',
        phase: 'play',
        host: { uid: 'test123', name: 'Player 1' },
        guest: { uid: 'bot123', name: 'Practice Bot 🤖', isBot: true },
        isSolo: true,
        rosters: {
          host: {
            name: 'Player 1',
            startingPitcher: 'PC01',
            reliefPitcher: 'PC07',
            lineup: LINEUP_PRESETS.sluggers.lineup,
            deckPreset: 'grind',
            ready: true
          },
          guest: {
            name: 'Practice Bot 🤖',
            startingPitcher: 'PC02',
            reliefPitcher: 'PC08',
            lineup: LINEUP_PRESETS.balanced.lineup,
            deckPreset: 'grind',
            ready: true
          }
        },
        gameState: {
          inning: 1,
          half: 'top',
          outs: 0,
          score: { top: 0, bottom: 0 },
          bases: { first: false, second: false, third: false },
          batterIndex: { top: 0, bottom: 0 },
          activePitcher: { host: 'PC01', guest: 'PC02' },
          pitcherPAs: { host: 0, guest: 0 },
          lastPitchCall: { host: null, guest: null },
          arsenalCharges: {
            host: { ...hostStarter.repertoire },
            guest: { ...guestStarter.repertoire }
          },
          hands: { host: hostHand, guest: guestHand },
          decks: { host: [], guest: [] },
          discards: { host: [], guest: [] },
          pitcherDecks: { host: [], guest: [] },
          batterDecks: { host: [], guest: [] },
          pitcherDiscards: { host: [], guest: [] },
          batterDiscards: { host: [], guest: [] }
        },
        currentPA: {
          phase: 'placing',
          beat: 'beat1',
          committed: { host: false, guest: false },
          firstRevealedCard: null,
          firstPlayerRole: null,
          secondPlayerRole: null,
          beatPlacements: {
            beat1: { host: {}, guest: {} },
            beat2: { host: {}, guest: {} }
          },
          beatResults: { beat1: null, beat2: null },
          placement: {
            host: { z1: [], z2: [] },
            guest: { z1: [], z2: [] }
          },
          resolution: null,
          isFirstPAOfInning: true
        }
      };

      function report(pass, text) {
        const p = document.createElement('p');
        p.className = pass ? 'pass' : 'fail';
        p.textContent = (pass ? '[PASS] ' : '[FAIL] ') + text;
        document.getElementById('test-results').appendChild(p);
      }

      console.log('Testing handleGameState(soloPlayState)...');
      window._lastGameState = soloPlayState;
      handleGameState(soloPlayState);

      // Verify app rendered
      const html = document.getElementById('app').innerHTML;
      report(html.length > 100, `Beat 1 placing rendered successfully (${html.length} chars)`);

      // Verify hand cards are pure number cards
      const numberCards = document.querySelectorAll('.hand-cards-container .number-card');
      report(numberCards.length > 0, `Hand renders pure number cards (found ${numberCards.length})`);
      const hasLegacyDesc = document.querySelector('.hc-desc') !== null;
      report(!hasLegacyDesc, 'Hand cards contain no legacy text descriptions or modifiers');

      // Verify Beat 1 placing places pitcher card on mound and batter card at home plate
      const slots = document.querySelectorAll('.b1-card-slot');
      report(slots.length === 2, 'Beat 1 placing renders exactly 2 card slots (mound and plate)');
      const pSlot = document.querySelector('.diamond-mound .b1-card-slot');
      const bSlot = document.querySelector('.diamond-plate-area .b1-card-slot');
      report(pSlot !== null && bSlot !== null, 'Beat 1 placing places pitcher card on mound and batter card at plate');
      report(pSlot.classList.contains('mine') && bSlot.classList.contains('opp'), 'Beat 1 placing places active user card on mound (mine) and opponent at plate (opp)');

      // 2b. Test Special Card Display (WP for Pitcher 1, K for Batter 1)
      report(getCardDisplay(1, true) === 'WP', 'getCardDisplay returns WP for Pitcher card 1');
      report(getCardDisplay(1, false) === 'K', 'getCardDisplay returns K for Batter card 1');
      report(getCardDisplay(5, true) === '5', 'getCardDisplay returns card value string for non-1 cards');

      // Test hand rendering with Card 1 (WP for pitcher, K for batter)
      const pitcherHandWithWP = renderHand(['P19'], false, true, false, 'beat2');
      report(pitcherHandWithWP.includes('wp-card') && pitcherHandWithWP.includes('WP') && pitcherHandWithWP.includes('WILD PITCH'), 'Pitcher Card 1 renders as WP with WILD PITCH badge');

      const batterHandWithK = renderHand(['B13'], true, false, false, 'beat2');
      report(batterHandWithK.includes('k-card') && batterHandWithK.includes('K') && batterHandWithK.includes('STRIKEOUT'), 'Batter Card 1 renders as K with STRIKEOUT badge');

      // Test mini placed card with WP and K
      const miniWP = renderMiniPlacedCard('P19', 'mound', true, 0, true);
      report(miniWP.includes('wp-card') && miniWP.includes('WP'), 'renderMiniPlacedCard renders WP card for pitcher');
      const miniK = renderMiniPlacedCard('B13', 'plate', true, 0, false);
      report(miniK.includes('k-card') && miniK.includes('K'), 'renderMiniPlacedCard renders K card for batter');

      // 3. Test Beat 1 Result Modal phase
      soloPlayState.currentPA.phase = 'beat1_result';
      soloPlayState.currentPA.beatResults.beat1 = {
        winner: 'pitcher',
        count: '0-2',
        countDisplay: "0-2 Pitcher's Count",
        pitcherCards: ['P1'],
        batterCards: ['B1'],
        pitcherTotal: 10,
        batterTotal: 2
      };
      handleGameState(soloPlayState);
      const b1Modal = document.getElementById('beat1-result-modal');
      report(b1Modal !== null, 'Beat 1 Result Modal renders in beat1_result phase');
      report(b1Modal?.textContent.includes('0-2'), 'Beat 1 Result Modal shows established count (0-2)');
      report(b1Modal?.querySelector('.anticipate-banner') !== null, 'Beat 1 Result Modal contains anticipation banner animation');
      report(b1Modal?.querySelector('.rm-suspense-label') !== null, 'Beat 1 Result Modal displays suspense duel header');

      // Verify Player card is on the left in Beat 1 Result Modal
      const rmBoxes = document.querySelectorAll('.rm-cards-compare .rm-player-box');
      report(rmBoxes.length === 2 && rmBoxes[0].classList.contains('mine') && rmBoxes[1].classList.contains('opp'), 'Beat 1 result modal places user card on left side and opponent on right');

      // 3b. Test proceedToBeat2() under Dominant Beat 1 condition
      let capturedUpdates = null;
      window.db = {
        ref: () => ({
          once: (evt, cb) => {
            const snap = {
              val: () => ({
                ...soloPlayState,
                currentPA: {
                  ...soloPlayState.currentPA,
                  beatResults: {
                    beat1: {
                      winner: 'pitcher',
                      count: '0-2',
                      isDominant: true,
                      revealCardFirst: 'batter',
                      margin: 8,
                      pitcherTotal: 10,
                      batterTotal: 2
                    }
                  }
                }
              })
            };
            cb(snap);
            return Promise.resolve(snap);
          },
          update: (updates) => {
            capturedUpdates = updates;
            return Promise.resolve();
          }
        })
      };

      proceedToBeat2();

      report(capturedUpdates !== null, 'proceedToBeat2 executed gameRef.update()');
      report(capturedUpdates?.['currentPA/phase'] === 'placing', 'proceedToBeat2 transitions phase to placing');
      report(capturedUpdates?.['currentPA/beat'] === 'beat2', 'proceedToBeat2 transitions beat to beat2');
      report(capturedUpdates?.['currentPA/committed/guest'] === true, 'Disadvantaged bot commits card face-up first');
      report(Boolean(capturedUpdates?.['currentPA/firstRevealedCard']), `Disadvantaged bot card is revealed (${capturedUpdates?.['currentPA/firstRevealedCard']})`);

      // Ensure no values in capturedUpdates contain undefined
      let hasUndefined = false;
      for (const [k, v] of Object.entries(capturedUpdates || {})) {
        if (v === undefined) hasUndefined = true;
        if (typeof v === 'object' && v !== null) {
          for (const [subK, subV] of Object.entries(v)) {
            if (subV === undefined) hasUndefined = true;
          }
        }
      }
      report(!hasUndefined, 'proceedToBeat2 updates payload contains zero undefined fields (prevents Firebase freeze)');

      // Restore mock db
      window.db = undefined;

      // 4. Test Beat 2 placing
      soloPlayState.currentPA.phase = 'placing';
      soloPlayState.currentPA.beat = 'beat2';
      soloPlayState.currentPA.beatResults.beat1 = {
        winner: 'batter',
        count: '3-1',
        lockedOption: 'offspeed',
        isDominant: true,
        revealCardFirst: 'pitcher',
        margin: 6
      };
      handleGameState(soloPlayState);
      const b2Html = document.getElementById('app').innerHTML;
      report(b2Html.length > 100, `Beat 2 placing rendered successfully (${b2Html.length} chars)`);
      const lockedOffspeed = document.querySelector('.choice-tile.locked');
      report(lockedOffspeed !== null && lockedOffspeed.textContent.includes('Offspeed'), 'Beat 2 locks out Offspeed pitch on 3-1 count');
      report(document.querySelector('.beat2-advantage-banner') !== null, 'Beat 2 advantage banner renders in Beat 2 arena');
      report(document.querySelector('.beat2-advantage-banner.count-hitter') !== null, 'Beat 2 advantage banner reflects 3-1 count leverage');
      report(document.querySelector('.opponent-bar .opp-scout-chips') === null, 'Opponent scouting chips removed from top opponent bar');
      report(document.querySelector('.player-bar .my-scout-chips') === null, 'User scouting chips removed from bottom player dock');
      report(document.querySelector('.diamond-pitcher-stats .field-scout-chips') !== null, 'Pitcher scouting stats display in top pitcher stats box (purple)');
      report(document.querySelector('.diamond-batter-stats .field-scout-chips') !== null, 'Batter scouting stats display in bottom batter stats box (red)');

      // 4b. Test Baseball Diamond & Drag Trays
      report(document.querySelector('.diamond-field') !== null, 'Play area renders Baseball Diamond field');
      report(document.querySelector('.diamond-mound') !== null, 'Pitcher card tray is positioned on pitcher mound (green)');
      report(document.querySelector('.diamond-plate-area') !== null, 'Batter card tray is positioned at home plate (orange)');
      const trays = document.querySelectorAll('.pitch-tray');
      report(trays.length === 3, `Beat 2 renders exactly 3 pitch selection trays (found ${trays.length})`);
      const draggableCards = document.querySelectorAll('.number-card[draggable="true"]');
      report(draggableCards.length > 0, `Active hand cards are draggable for drag-and-drop (found ${draggableCards.length})`);
      report(document.querySelector('.pitch-tray[data-pitch]') !== null, 'Pitch trays contain data-pitch attributes for drop targeting');
      report(document.querySelector('.pt-range') === null, 'Pitch number ranges removed from diamond trays');
      report(document.querySelector('.pt-fav-tag') === null, 'Favorite pitch tags removed from diamond trays');

      // 4c. Test Tooltip Popup System
      showTooltipPopup('Fastball Intel', 'High heat window is 6-10.');
      const ttpEl = document.getElementById('fc-tooltip-popover');
      report(ttpEl !== null && ttpEl.classList.contains('visible'), 'Long-press / tap tooltip popup opens successfully');
      report(ttpEl?.textContent.includes('High heat window'), 'Tooltip popup displays descriptive body text');
      hideTooltipPopup();
      report(!ttpEl?.classList.contains('visible'), 'Tooltip popup closes cleanly');

      // 5. Test Resolved phase (At-Bat Outcome Pop-up)
      soloPlayState.currentPA.phase = 'resolved';
      soloPlayState.currentPA.resolution = {
        outcome: { display: '💥 HOME RUN!', runsScored: 2, outsAdded: 0 },
        z1: { winner: 'batter', count: '3-1', pitcherTotal: 3, batterTotal: 8 },
        z2: {
          pitchType: 'fastball',
          pitchLocation: 'high',
          pitcherExecuted: true,
          swingType: 'power',
          targetZone: 'high',
          batterExecuted: true,
          sameLocation: true,
          isHotZone: true,
          outcomeDisplay: 'Home Run',
          ruleReason: 'Fastball was squared up with Delta 0 timing for a Home Run.'
        }
      };
      handleGameState(soloPlayState);
      const outcomeModal = document.getElementById('outcome-overlay');
      report(outcomeModal !== null, 'At-Bat Outcome Pop-up renders in resolved phase');
      report(outcomeModal?.textContent.includes('HOME RUN'), 'At-Bat Outcome Pop-up shows outcome headline');
      report(outcomeModal?.querySelector('.anticipate-outcome') !== null, 'Outcome overlay includes dramatic outcome slam animation');
      report(outcomeModal?.querySelector('.rm-suspense-label') !== null, 'Outcome overlay includes suspense payoff clash tag');
      report(outcomeModal?.querySelector('.rm-resolution-breakdown') !== null, 'Outcome overlay includes 3-step resolution breakdown');
      report(outcomeModal?.querySelector('.rm-rule-explanation') !== null, 'Outcome overlay includes plain-English rule explanation');
      report(outcomeModal?.querySelector('.rm-matrix-guide') !== null, 'Outcome overlay includes collapsible matrix guide');

      // 6. Test Wild Pitch Result Modal
      soloPlayState.currentPA.phase = 'wild_pitch_result';
      soloPlayState.currentPA.resolution = {
        outcome: { display: '⚡ WILD PITCH IN THE DIRT!', runsScored: 0, outsAdded: 0, isWildPitchReset: true, ruleReason: 'Wild pitch in dirt' },
        z1: { count: '0-2' },
        z2: {
          pitchType: 'fastball',
          guessPitch: 'offspeed',
          pitcherCardVal: 3,
          batterCardVal: 3,
          timingDelta: 0
        }
      };
      handleGameState(soloPlayState);
      const wpModal = document.getElementById('wild-pitch-modal');
      report(wpModal !== null, 'Wild Pitch result modal renders when phase is wild_pitch_result');
      report(wpModal?.textContent.includes('WILD PITCH IN THE DIRT'), 'Wild Pitch modal shows correct title');
      report(wpModal?.querySelector('.btn-wild-pitch-continue') !== null, 'Wild Pitch modal provides continue button');

      // 7. Test Battle Back Result Modal (Beat 2 Battle-Back forcing Beat 3 Showdown)
      soloPlayState.currentPA.phase = 'battle_back_result';
      soloPlayState.currentPA.beat = 'beat3';
      soloPlayState.currentPA.beatResults.beat2 = {
        isBattleBack: true,
        pitchType: 'fastball',
        guessPitch: 'fastball',
        pitchMatched: true,
        pitcherCardVal: 7,
        batterCardVal: 7,
        pitcherBaseBonus: 6,
        batterBaseBonus: 6,
        pitcherEffectiveVal: 13,
        batterEffectiveVal: 13,
        timingDelta: 1,
        ruleReason: 'Batter fouled off 2-strike pitch to battle back! Count runs full to 3-2!'
      };
      handleGameState(soloPlayState);
      const bbModal = document.getElementById('battle-back-modal');
      report(bbModal !== null, 'Battle Back modal renders in battle_back_result phase');
      report(bbModal?.textContent.includes('BATTLED BACK!'), 'Battle Back modal shows dramatic battle back header');
      report(bbModal?.textContent.includes('FULL COUNT SHOWDOWN FORCED!'), 'Battle Back modal highlights 3-2 Full Count showdown');
      report(bbModal?.querySelector('.btn-battle-back-continue') !== null, 'Battle Back modal provides continue to showdown button');

      // 7b. Test proceedToBeat3()
      let bbUpdates = null;
      window.db = {
        ref: () => ({
          once: (evt, cb) => {
            const snap = { val: () => soloPlayState };
            cb(snap);
            return Promise.resolve(snap);
          },
          update: (updates) => {
            bbUpdates = updates;
            return Promise.resolve();
          }
        })
      };
      proceedToBeat3();
      report(bbUpdates !== null, 'proceedToBeat3 executed gameRef.update()');
      report(bbUpdates?.['currentPA/phase'] === 'placing', 'proceedToBeat3 transitions phase to placing');
      report(bbUpdates?.['currentPA/beat'] === 'beat3', 'proceedToBeat3 transitions beat to beat3');
      report(bbUpdates?.['currentPA/committed/host'] === false, 'proceedToBeat3 resets host committed status');
      report(bbUpdates?.['currentPA/committed/guest'] === false, 'proceedToBeat3 resets guest committed status');
      window.db = undefined;

      // 8. Test Beat 3 Full Count Showdown placing
      soloPlayState.currentPA.phase = 'placing';
      soloPlayState.currentPA.beat = 'beat3';
      handleGameState(soloPlayState);
      const b3Html = document.getElementById('app').innerHTML;
      report(b3Html.length > 100, `Beat 3 placing rendered successfully (${b3Html.length} chars)`);
      report(document.querySelector('.beat3-banner') !== null, 'Beat 3 Full Count Showdown banner renders');
      report(document.querySelector('.beat3-arena') !== null, 'Beat 3 arena class applied to battlefield');
      const ratingBadges = document.querySelectorAll('.pt-rating-badge');
      report(ratingBadges.length >= 3, `Base pitch rating badges render on diamond trays (found ${ratingBadges.length})`);
      const b3LockBtn = document.getElementById('lock-btn');
      report(b3LockBtn !== null, 'Lock-in button exists in Beat 3');
      report(b3LockBtn?.textContent.includes('SHOWDOWN'), 'Lock-in button reflects SHOWDOWN context');

    } catch(e) {
      const p = document.createElement('p');
      p.className = 'fail';
      p.textContent = `[FAIL] ${e.message}`;
      document.getElementById('test-results').appendChild(p);
    }
  </script>
</body>
</html>
