<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Play UI</title>
  <link rel="stylesheet" href="../fullcount.css">
  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.body.innerHTML += `<p class="fail">[SYNTAX/SCRIPT ERROR] ${msg} at line ${line} in ${url}</p>`;
    };
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="test-results"></div>

  <!-- Mock Firebase -->
  <script>
    window._isDevPreview = true;
    window.myRole = 'host';
    window.gameId = 'SOLO99';
    window.myUid = 'test123';
  </script>
  <script src="../js/data.js"></script>
  <script src="../js/resolution.js"></script>
  <script src="../js/app.js"></script>

  <script>

    try {
      // 1. Test roster state
      const soloRosterState = {
        code: 'SOLO99',
        phase: 'roster',
        host: { uid: 'test123', name: 'Player 1' },
        guest: { uid: 'bot123', name: 'Practice Bot 🤖', isBot: true },
        isSolo: true,
        rosters: { host: null, guest: null },
        gameState: null,
        currentPA: null
      };

      console.log('Testing handleGameState(soloRosterState)...');
      // handleGameState(soloRosterState);

      // 2. Test play state
      const hostStarter = PITCHER_CHARACTERS['PC01'];
      const guestStarter = PITCHER_CHARACTERS['PC02'];
      const hostHand = ['P1', 'P2', 'P11', 'P12', 'P21'];
      const guestHand = ['B1', 'B2', 'B11', 'B12', 'B21'];

      const soloPlayState = {
        code: 'SOLO99',
        phase: 'play',
        host: { uid: 'test123', name: 'Player 1' },
        guest: { uid: 'bot123', name: 'Practice Bot 🤖', isBot: true },
        isSolo: true,
        rosters: {
          host: {
            name: 'Player 1',
            startingPitcher: 'PC01',
            reliefPitcher: 'PC07',
            lineup: LINEUP_PRESETS.sluggers.lineup,
            deckPreset: 'grind',
            ready: true
          },
          guest: {
            name: 'Practice Bot 🤖',
            startingPitcher: 'PC02',
            reliefPitcher: 'PC08',
            lineup: LINEUP_PRESETS.balanced.lineup,
            deckPreset: 'grind',
            ready: true
          }
        },
        gameState: {
          inning: 1,
          half: 'top',
          outs: 0,
          score: { top: 0, bottom: 0 },
          bases: { first: false, second: false, third: false },
          batterIndex: { top: 0, bottom: 0 },
          activePitcher: { host: 'PC01', guest: 'PC02' },
          pitcherPAs: { host: 0, guest: 0 },
          lastPitchCall: { host: null, guest: null },
          arsenalCharges: {
            host: { ...hostStarter.repertoire },
            guest: { ...guestStarter.repertoire }
          },
          hands: { host: hostHand, guest: guestHand },
          decks: { host: [], guest: [] },
          discards: { host: [], guest: [] },
          pitcherDecks: { host: [], guest: [] },
          batterDecks: { host: [], guest: [] },
          pitcherDiscards: { host: [], guest: [] },
          batterDiscards: { host: [], guest: [] }
        },
        currentPA: {
          phase: 'placing',
          beat: 'beat1',
          committed: { host: false, guest: false },
          firstRevealedCard: null,
          firstPlayerRole: null,
          secondPlayerRole: null,
          beatPlacements: {
            beat1: { host: {}, guest: {} },
            beat2: { host: {}, guest: {} }
          },
          beatResults: { beat1: null, beat2: null },
          placement: {
            host: { z1: [], z2: [] },
            guest: { z1: [], z2: [] }
          },
          resolution: null,
          isFirstPAOfInning: true
        }
      };

      function report(pass, text) {
        const p = document.createElement('p');
        p.className = pass ? 'pass' : 'fail';
        p.textContent = (pass ? '[PASS] ' : '[FAIL] ') + text;
        document.getElementById('test-results').appendChild(p);
      }

      console.log('Testing handleGameState(soloPlayState)...');
      window._lastGameState = soloPlayState;
      handleGameState(soloPlayState);

      // Verify app rendered
      const html = document.getElementById('app').innerHTML;
      report(html.length > 100, `Beat 1 placing rendered successfully (${html.length} chars)`);

      // Verify hand cards are pure number cards
      const numberCards = document.querySelectorAll('.hand-cards-container .number-card');
      report(numberCards.length > 0, `Hand renders pure number cards (found ${numberCards.length})`);
      const hasLegacyDesc = document.querySelector('.hc-desc') !== null;
      report(!hasLegacyDesc, 'Hand cards contain no legacy text descriptions or modifiers');

      // Verify Beat 1 placing places pitcher card on mound and batter card at home plate
      const slots = document.querySelectorAll('.b1-card-slot');
      report(slots.length === 2, 'Beat 1 placing renders exactly 2 card slots (mound and plate)');
      const pSlot = document.querySelector('.diamond-mound .b1-card-slot');
      const bSlot = document.querySelector('.diamond-plate-area .b1-card-slot');
      report(pSlot !== null && bSlot !== null, 'Beat 1 placing places pitcher card on mound and batter card at plate');
      report(pSlot.classList.contains('mine') && bSlot.classList.contains('opp'), 'Beat 1 placing places active user card on mound (mine) and opponent at plate (opp)');

      // Verify no pitch tray is highlighted by default
      const activeTraysInitial = document.querySelectorAll('.pitch-tray.active');
      report(activeTraysInitial.length === 0, `Beat 1 placing starts with no default pitch selected (found ${activeTraysInitial.length} active trays)`);

      // Verify Lock-in button is disabled initially
      const lockBtnInit = document.getElementById('lock-btn');
      report(lockBtnInit !== null && lockBtnInit.disabled === true, 'Lock-in button is disabled initially when neither pitch nor card is chosen');

      // Test selecting Breaking Ball
      handleTrayClick('breaking', 'mound');
      const breakingTray = document.querySelector('.pitch-tray[data-pitch="breaking"]');
      const activeTraysAfterBreaking = document.querySelectorAll('.pitch-tray.active');
      report(breakingTray?.classList.contains('active') && activeTraysAfterBreaking.length === 1, 'Clicking Breaking tray highlights Breaking as active pitch');

      // Test selecting Offspeed switches pitch
      handleTrayClick('offspeed', 'mound');
      const offspeedTray = document.querySelector('.pitch-tray[data-pitch="offspeed"]');
      report(offspeedTray?.classList.contains('active') && !document.querySelector('.pitch-tray[data-pitch="breaking"]')?.classList.contains('active'), 'Clicking Offspeed tray switches active pitch to Offspeed');

      // Test lock-in button is enabled when pitch is selected (card not required in Beat 1)
      const lockBtnWithPitchOnly = document.getElementById('lock-btn');
      report(lockBtnWithPitchOnly?.disabled === false, 'Lock-in button is enabled when pitch is selected without a card');

      // Test tapping a card in Beat 1 does not play it (cards are unplayable in Beat 1)
      selectCard('P1');
      report(localBeatCard === null, 'Tapping card in Beat 1 does not play card (cards reserved for Beat 2)');

      // Test pointer-events on Beat 1 pitch buttons (must not be 'none')
      const pitchTrays = document.querySelectorAll('.pitch-selection-dock .pitch-tray');
      report(pitchTrays.length === 3, `Found 3 pitch buttons above user cards in Beat 1`);
      let allPeAuto = true;
      pitchTrays.forEach(t => {
        if (window.getComputedStyle(t).pointerEvents !== 'auto') allPeAuto = false;
      });
      report(allPeAuto, 'All Beat 1 pitch buttons have pointer-events auto (interactive for clicks and drops)');

      // Test selecting Fastball pitch
      handleTrayClick('fastball', 'mound');
      report(localPitchType === 'fastball', `Selecting Fastball selects Fastball pitch (is: ${localPitchType})`);
      report(localBeatCard === null, `Cards cannot be placed in Beat 1 (localBeatCard is null)`);
      const fbActiveTray = document.querySelector('.pitch-tray.active');
      report(fbActiveTray?.getAttribute('data-pitch') === 'fastball', 'Fastball tray is highlighted active after selection');

      // Test switching pitch to Breaking
      handleTrayClick('breaking', 'mound');
      report(localPitchType === 'breaking', `Clicking Breaking switches pitch to Breaking (is: ${localPitchType})`);
      report(localBeatCard === null, 'localBeatCard remains null in Beat 1');

      // Test commitPlacement() in Solo match
      let commitUpdates = null;
      let mockSnapState = JSON.parse(JSON.stringify(soloPlayState));
      window.db = {
        ref: () => ({
          once: (evt, cb) => {
            const snap = { val: () => mockSnapState };
            cb(snap);
            return Promise.resolve(snap);
          },
          update: (u) => {
            commitUpdates = u;
            // Apply updates to mockSnapState
            for (let k in u) {
              const parts = k.split('/');
              let cur = mockSnapState;
              for (let i = 0; i < parts.length - 1; i++) {
                if (!cur[parts[i]]) cur[parts[i]] = {};
                cur = cur[parts[i]];
              }
              cur[parts[parts.length - 1]] = u[k];
            }
            return Promise.resolve();
          }
        })
      };

      localPitchType = 'fastball';
      localBeatCard = 'P11';
      commitPlacement();

      report(commitUpdates !== null, 'commitPlacement executed gameRef.update()');
      report(commitUpdates?.['currentPA/committed/host'] === true, 'commitPlacement marks host as committed');
      report(commitUpdates?.['currentPA/committed/guest'] === true, 'commitPlacement marks bot guest as committed');
      report(Boolean(commitUpdates?.['currentPA/beatPlacements/beat1/guest']?.cardId), 'Bot selected card for Beat 1');
      report(Boolean(commitUpdates?.['currentPA/beatPlacements/beat1/guest']?.guessPitch), 'Bot selected pitch for Beat 1');

      // Verify no undefined fields in commit updates
      let commitHasUndefined = false;
      for (const [k, v] of Object.entries(commitUpdates || {})) {
        if (v === undefined) commitHasUndefined = true;
        if (typeof v === 'object' && v !== null) {
          for (const [subK, subV] of Object.entries(v)) {
            if (subV === undefined) commitHasUndefined = true;
          }
        }
      }
      report(!commitHasUndefined, 'commitPlacement updates payload contains zero undefined fields');

      // Restore mock db
      window.db = undefined;

      // Clean up local placement for subsequent tests
      localPitchType = null;
      localBeatCard = null;
      selectedCard = null;
      handleGameState(soloPlayState);

      // 2b. Test Pure Number Card Display (Values 1-6)
      report(getCardDisplay(1, true) === '1', 'getCardDisplay returns 1 for Pitcher card 1');
      report(getCardDisplay(1, false) === '1', 'getCardDisplay returns 1 for Batter card 1');
      report(getCardDisplay(5, true) === '5', 'getCardDisplay returns card value string for non-1 cards');

      // Test hand rendering with Card 1 (pure number 1 without special badges)
      const pitcherHandWith1 = renderHand(['P19'], false, true, false, 'beat2');
      report(pitcherHandWith1.includes('card-hero-num') && pitcherHandWith1.includes('1'), 'Pitcher Card 1 renders as pure number 1');

      const batterHandWith1 = renderHand(['B13'], true, false, false, 'beat2');
      report(batterHandWith1.includes('card-hero-num') && batterHandWith1.includes('1'), 'Batter Card 1 renders as pure number 1');

      // Test mini placed card
      const miniP1 = renderMiniPlacedCard('P19', 'mound', true, 0, true);
      report(miniP1.includes('placed-number-card') && miniP1.includes('1'), 'renderMiniPlacedCard renders card 1 for pitcher');
      const miniB1 = renderMiniPlacedCard('B13', 'plate', true, 0, false);
      report(miniB1.includes('placed-number-card') && miniB1.includes('1'), 'renderMiniPlacedCard renders card 1 for batter');

      // 3. Test Beat 1 Result Modal phase
      soloPlayState.currentPA.phase = 'beat1_result';
      soloPlayState.currentPA.beatResults.beat1 = {
        winner: 'pitcher',
        count: '0-2',
        countDisplay: "0-2 Pitcher's Count",
        pitcherCards: ['P1'],
        batterCards: ['B1'],
        pitcherTotal: 10,
        batterTotal: 2
      };
      handleGameState(soloPlayState);
      const b1Modal = document.getElementById('beat1-result-modal');
      report(b1Modal !== null, 'Beat 1 Result Modal renders in beat1_result phase');
      report(b1Modal?.textContent.includes('0-2'), 'Beat 1 Result Modal shows established count (0-2)');
      report(b1Modal?.querySelector('.anticipate-banner') !== null, 'Beat 1 Result Modal contains anticipation banner animation');
      report(b1Modal?.querySelector('.rm-suspense-label') !== null, 'Beat 1 Result Modal displays suspense duel header');

      // Verify Player card is on the left in Beat 1 Result Modal
      const rmBoxes = document.querySelectorAll('.rm-cards-compare .rm-player-box');
      report(rmBoxes.length === 2 && rmBoxes[0].classList.contains('mine') && rmBoxes[1].classList.contains('opp'), 'Beat 1 result modal places user card on left side and opponent on right');

      // 3b. Test proceedToBeat2() under Dominant Beat 1 condition
      let capturedUpdates = null;
      window.db = {
        ref: () => ({
          once: (evt, cb) => {
            const snap = {
              val: () => ({
                ...soloPlayState,
                currentPA: {
                  ...soloPlayState.currentPA,
                  beatResults: {
                    beat1: {
                      winner: 'pitcher',
                      count: '0-2',
                      isDominant: true,
                      revealCardFirst: 'batter',
                      margin: 8,
                      pitcherTotal: 10,
                      batterTotal: 2
                    }
                  }
                }
              })
            };
            cb(snap);
            return Promise.resolve(snap);
          },
          update: (updates) => {
            capturedUpdates = updates;
            return Promise.resolve();
          }
        })
      };

      proceedToBeat2();

      report(capturedUpdates !== null, 'proceedToBeat2 executed gameRef.update()');
      report(capturedUpdates?.['currentPA/phase'] === 'placing', 'proceedToBeat2 transitions phase to placing');
      report(capturedUpdates?.['currentPA/beat'] === 'beat2', 'proceedToBeat2 transitions beat to beat2');
      report(capturedUpdates?.['currentPA/committed/guest'] === true, 'Disadvantaged bot commits card face-up first');
      report(Boolean(capturedUpdates?.['currentPA/firstRevealedCard']), `Disadvantaged bot card is revealed (${capturedUpdates?.['currentPA/firstRevealedCard']})`);

      // Ensure no values in capturedUpdates contain undefined
      let hasUndefined = false;
      for (const [k, v] of Object.entries(capturedUpdates || {})) {
        if (v === undefined) hasUndefined = true;
        if (typeof v === 'object' && v !== null) {
          for (const [subK, subV] of Object.entries(v)) {
            if (subV === undefined) hasUndefined = true;
          }
        }
      }
      report(!hasUndefined, 'proceedToBeat2 updates payload contains zero undefined fields (prevents Firebase freeze)');

      // Restore mock db
      window.db = undefined;

      // 4. Test Beat 2 placing
      soloPlayState.currentPA.phase = 'placing';
      soloPlayState.currentPA.beat = 'beat2';
      soloPlayState.currentPA.beatResults.beat1 = {
        winner: 'batter',
        count: '3-1',
        pitchType: 'fastball',
        guessPitch: 'fastball',
        pitchMatched: true,
        target: 5,
        effectiveTarget: 5,
        baseTarget: 4,
        readFactor: 1,
        isDominant: true,
        revealCardFirst: 'pitcher',
        margin: 1
      };
      handleGameState(soloPlayState);
      const b2Html = document.getElementById('app').innerHTML;
      report(b2Html.length > 100, `Beat 2 placing rendered successfully (${b2Html.length} chars)`);
      report(document.querySelector('.b2-target-showcase') !== null, 'Beat 2 renders Pitch & Target showcase instead of pitch selection trays');
      report(b2Html.includes('TARGET 5') || b2Html.includes('TARGET <b>5</b>'), 'Beat 2 displays established target number 5');
      report(b2Html.includes('FASTBALL'), 'Beat 2 displays established pitch being thrown');
      report(document.querySelector('.b2-card-slot') !== null, 'Beat 2 renders dedicated execution card slot');
      report(document.querySelector('.beat2-advantage-banner') !== null, 'Beat 2 advantage banner renders in Beat 2 arena');
      report(document.querySelector('.beat2-advantage-banner.count-hitter') !== null, 'Beat 2 advantage banner reflects 3-1 count leverage');
      report(document.querySelector('.opponent-bar .opp-scout-chips') === null, 'Opponent scouting chips removed from top opponent bar');
      report(document.querySelector('.player-bar .my-scout-chips') === null, 'User scouting chips removed from bottom player dock');
      report(document.querySelector('.diamond-pitcher-stats .field-scout-chips') !== null, 'Pitcher scouting stats display in top pitcher stats box (purple)');
      report(document.querySelector('.diamond-batter-stats .field-scout-chips') !== null, 'Batter scouting stats display in bottom batter stats box (red)');

      // 4b. Test Baseball Diamond & Active Hand Cards in Beat 2
      report(document.querySelector('.diamond-field') !== null, 'Play area renders Baseball Diamond field');
      report(document.querySelector('.diamond-mound') !== null, 'Pitcher card showcase is positioned on pitcher mound (green)');
      report(document.querySelector('.diamond-plate-area') !== null, 'Batter card showcase is positioned at home plate (orange)');
      const draggableCards = document.querySelectorAll('.number-card[draggable="true"]');
      report(draggableCards.length > 0, `Active hand cards are playable for Beat 2 clash (found ${draggableCards.length})`);

      // 4c. Test Tooltip Popup System
      showTooltipPopup('Fastball Intel', 'High heat window is 6-10.');
      const ttpEl = document.getElementById('fc-tooltip-popover');
      report(ttpEl !== null && ttpEl.classList.contains('visible'), 'Long-press / tap tooltip popup opens successfully');
      report(ttpEl?.textContent.includes('High heat window'), 'Tooltip popup displays descriptive body text');
      hideTooltipPopup();
      report(!ttpEl?.classList.contains('visible'), 'Tooltip popup closes cleanly');

      // 5. Test Resolved phase (At-Bat Outcome Pop-up)
      soloPlayState.currentPA.phase = 'resolved';
      soloPlayState.currentPA.resolution = {
        outcome: { display: '💥 HOME RUN!', runsScored: 2, outsAdded: 0 },
        z1: { winner: 'batter', count: '3-1', pitcherTotal: 3, batterTotal: 8 },
        z2: {
          pitchType: 'fastball',
          pitchLocation: 'high',
          pitcherExecuted: true,
          swingType: 'power',
          targetZone: 'high',
          batterExecuted: true,
          sameLocation: true,
          isHotZone: true,
          outcomeDisplay: 'Home Run',
          ruleReason: 'Fastball was squared up on Total 12 Sweet Spot barrel for a Home Run.'
        }
      };
      handleGameState(soloPlayState);
      const outcomeModal = document.getElementById('outcome-overlay');
      report(outcomeModal !== null, 'At-Bat Outcome Pop-up renders in resolved phase');
      report(outcomeModal?.textContent.includes('HOME RUN'), 'At-Bat Outcome Pop-up shows outcome headline');
      report(outcomeModal?.querySelector('.anticipate-outcome') !== null, 'Outcome overlay includes dramatic outcome slam animation');
      report(outcomeModal?.querySelector('.rm-suspense-label') !== null, 'Outcome overlay includes suspense payoff clash tag');
      report(outcomeModal?.querySelector('.rm-resolution-breakdown') !== null, 'Outcome overlay includes 3-step resolution breakdown');
      report(outcomeModal?.querySelector('.rm-rule-explanation') !== null, 'Outcome overlay includes plain-English rule explanation');
      report(outcomeModal?.querySelector('.rm-matrix-guide') !== null, 'Outcome overlay includes collapsible matrix guide');

      // 6. Test Wild Pitch Result Modal
      soloPlayState.currentPA.phase = 'wild_pitch_result';
      soloPlayState.currentPA.resolution = {
        outcome: { display: '⚡ WILD PITCH IN THE DIRT!', runsScored: 0, outsAdded: 0, isWildPitchReset: true, ruleReason: 'Wild pitch in dirt' },
        z1: { count: '0-2' },
        z2: {
          pitchType: 'fastball',
          guessPitch: 'offspeed',
          pitcherCardVal: 3,
          batterCardVal: 3,
          timingDelta: 0
        }
      };
      handleGameState(soloPlayState);
      const wpModal = document.getElementById('wild-pitch-modal');
      report(wpModal !== null, 'Wild Pitch result modal renders when phase is wild_pitch_result');
      report(wpModal?.textContent.includes('WILD PITCH IN THE DIRT'), 'Wild Pitch modal shows correct title');
      report(wpModal?.querySelector('.btn-wild-pitch-continue') !== null, 'Wild Pitch modal provides continue button');

      // 7. Test Battle Back Result Modal (Beat 2 Battle-Back forcing Beat 3 Showdown)
      soloPlayState.currentPA.phase = 'battle_back_result';
      soloPlayState.currentPA.beat = 'beat3';
      soloPlayState.currentPA.beatResults.beat2 = {
        isBattleBack: true,
        pitchType: 'fastball',
        guessPitch: 'fastball',
        pitchMatched: true,
        pitcherCardVal: 7,
        batterCardVal: 7,
        pitcherBaseBonus: 6,
        batterBaseBonus: 6,
        pitcherEffectiveVal: 13,
        batterEffectiveVal: 13,
        timingDelta: 1,
        ruleReason: 'Batter fouled off 2-strike pitch to battle back! Count runs full to 3-2!'
      };
      handleGameState(soloPlayState);
      const bbModal = document.getElementById('battle-back-modal');
      report(bbModal !== null, 'Battle Back modal renders in battle_back_result phase');
      report(bbModal?.textContent.includes('BATTLED BACK!'), 'Battle Back modal shows dramatic battle back header');
      report(bbModal?.textContent.includes('FULL COUNT SHOWDOWN FORCED!'), 'Battle Back modal highlights 3-2 Full Count showdown');
      report(bbModal?.querySelector('.btn-battle-back-continue') !== null, 'Battle Back modal provides continue to showdown button');

      // 7b. Test proceedToBeat3()
      let bbUpdates = null;
      window.db = {
        ref: () => ({
          once: (evt, cb) => {
            const snap = { val: () => soloPlayState };
            cb(snap);
            return Promise.resolve(snap);
          },
          update: (updates) => {
            bbUpdates = updates;
            return Promise.resolve();
          }
        })
      };
      proceedToBeat3();
      report(bbUpdates !== null, 'proceedToBeat3 executed gameRef.update()');
      report(bbUpdates?.['currentPA/phase'] === 'placing', 'proceedToBeat3 transitions phase to placing');
      report(bbUpdates?.['currentPA/beat'] === 'beat3', 'proceedToBeat3 transitions beat to beat3');
      report(bbUpdates?.['currentPA/committed/host'] === false, 'proceedToBeat3 resets host committed status');
      report(bbUpdates?.['currentPA/committed/guest'] === false, 'proceedToBeat3 resets guest committed status');
      window.db = undefined;

      // 8. Test Beat 3 Full Count Showdown placing
      soloPlayState.currentPA.phase = 'placing';
      soloPlayState.currentPA.beat = 'beat3';
      handleGameState(soloPlayState);
      const b3Html = document.getElementById('app').innerHTML;
      report(b3Html.length > 100, `Beat 3 placing rendered successfully (${b3Html.length} chars)`);
      report(document.querySelector('.beat3-banner') !== null, 'Beat 3 Full Count Showdown banner renders');
      report(document.querySelector('.beat3-arena') !== null, 'Beat 3 arena class applied to battlefield');
      const ratingBadges = document.querySelectorAll('.pt-rating-badge');
      report(ratingBadges.length >= 3, `Base pitch rating badges render on pitch buttons (found ${ratingBadges.length})`);
      report(ratingBadges[0].textContent.includes('Target 2'), 'Beat 3 pitch targets reflect Big Jake Harmon base target 2');
      report(ratingBadges[1].textContent.includes('Target 4'), 'Beat 3 pitch targets reflect Big Jake Harmon base target 4');
      report(ratingBadges[2].textContent.includes('Target 5'), 'Beat 3 pitch targets reflect Big Jake Harmon base target 5');
      const b3LockBtn = document.getElementById('lock-btn');
      report(b3LockBtn !== null, 'Lock-in button exists in Beat 3');
      report(b3LockBtn?.textContent.includes('SHOWDOWN'), 'Lock-in button reflects SHOWDOWN context');

      // 9. Test Outcome Number Line Component
      report(typeof window.renderOutcomeNumberLine === 'function', 'renderOutcomeNumberLine helper is defined');
      
      const fbNl = window.renderOutcomeNumberLine({ pitchType: 'fastball', beat: 'beat1' });
      report(fbNl.includes('outcome-number-line-container'), 'Number line renders container element');
      report(fbNl.includes('FASTBALL') && fbNl.includes('Base Target'), 'Fastball Beat 1 displays Fastball and Base Target');
      report(fbNl.includes('3-1 HITTER COUNT') && fbNl.includes('0-2 PITCHER COUNT'), 'Beat 1 displays 3-1 Hitter Count and 0-2 Pitcher Count previews');
      report(fbNl.includes('b1-preview-track'), 'Beat 1 renders b1-preview-track');

      const bbNl = window.renderOutcomeNumberLine({ pitchType: 'breaking', beat: 'beat2', target: 4, pitcherCardVal: 4, launchAngle: 4 });
      report(bbNl.includes('BREAKING') && bbNl.includes('Target <b>4</b>'), 'Breaking Beat 2 displays Breaking and Target 4');
      report(bbNl.includes('center-spot') && bbNl.includes('sweet-spot'), 'Collision is styled as center-spot and sweet-spot');
      report(bbNl.includes('nl-needle-pin') && bbNl.includes('CARD 4'), 'Needle pin displays CARD 4 on needle target');
      report(bbNl.includes('line-drive'), 'Target window includes line-drive hit band');

      const offNl = window.renderOutcomeNumberLine({ pitchType: 'offspeed', beat: 'beat3', target: 3, pitcherCardVal: 4, launchAngle: 5, projected: true });
      report(offNl.includes('OFFSPEED') && offNl.includes('Target <b>3</b>'), 'Offspeed Beat 3 displays Offspeed and Target 3');
      report(offNl.includes('EST 5'), 'Projected needle displays EST 5 prefix');

      const unselectedNl = window.renderOutcomeNumberLine({ pitchType: null });
      report(unselectedNl.includes('SELECT PITCH TO PREVIEW'), 'Unselected displays SELECT PITCH TO PREVIEW badge');
      report(unselectedNl.includes('unselected'), 'Unselected number line cells contain unselected class');

      // Verify number line in Beat 2 execution clash
      soloPlayState.currentPA.beat = 'beat2';
      handleGameState(soloPlayState);
      report(document.querySelector('.diamond-number-line') !== null, 'Diamond battlefield renders live color-coded number line');

      // 10. Test Pitch Result Screen: No cards displayed, only the two pitches, advantage, and new target
      soloPlayState.currentPA.phase = 'beat1_result';
      soloPlayState.currentPA.beatResults.beat1 = {
        winner: 'batter',
        count: '3-1',
        pitchType: 'fastball',
        guessPitch: 'fastball',
        baseTarget: 4,
        readFactor: 2,
        effectiveTarget: 6,
        pitchMatched: true
      };
      handleGameState(soloPlayState);
      const b1PitchModal = document.getElementById('beat1-result-modal');
      report(b1PitchModal !== null, 'Beat 1 Pitch Result modal renders');
      report(b1PitchModal?.querySelectorAll('.number-card').length === 0, 'Beat 1 Result modal shows zero number cards');
      report(b1PitchModal?.querySelectorAll('.rm-pitch-showcase-tile').length === 2, 'Beat 1 Result modal displays the two pitch tiles');
      report(b1PitchModal?.querySelector('.rm-target-highlight') !== null, 'Beat 1 Result modal displays new target highlight');
      report(b1PitchModal?.querySelector('.rm-th-number')?.textContent.trim() === '6', 'Target highlight shows effective target number 6');
      report(b1PitchModal?.querySelector('.anticipate-banner')?.textContent.includes('BATTER ADVANTAGE'), 'Beat 1 Result modal shows advantage outcome');

      // 11. Test Beat 3 Pitch Selection Lock-In & Result Modal
      soloPlayState.currentPA.phase = 'placing';
      soloPlayState.currentPA.beat = 'beat3';
      soloPlayState.currentPA.committed = { host: false, guest: false };
      handleGameState(soloPlayState);

      // In Beat 3, player selects pitch (no card needed)
      localPitchType = 'breaking';
      localBeatCard = null;
      let b3CommitUpdates = null;
      window.db = {
        ref: () => ({
          once: (evt, cb) => {
            const snap = { val: () => soloPlayState };
            cb(snap);
            return Promise.resolve(snap);
          },
          update: (u) => {
            b3CommitUpdates = u;
            return Promise.resolve();
          }
        })
      };
      commitPlacement();
      report(b3CommitUpdates !== null, 'Beat 3 pitch lock-in executes successfully without requiring a card');
      report(b3CommitUpdates?.['currentPA/beatPlacements/beat3/host']?.pitchType === 'breaking', 'Beat 3 commits chosen pitch type');
      window.db = undefined;

      // 12. Test Beat 3 Result Modal & Transition to Beat 4
      soloPlayState.currentPA.phase = 'beat3_result';
      soloPlayState.currentPA.beatResults.beat3 = {
        winner: 'pitcher',
        count: '3-2',
        pitchType: 'breaking',
        guessPitch: 'fastball',
        baseTarget: 4,
        readFactor: 2,
        effectiveTarget: 4,
        pitchMatched: false
      };
      handleGameState(soloPlayState);
      const b3Modal = document.getElementById('beat3-result-modal');
      report(b3Modal !== null, 'Beat 3 Result Modal renders in beat3_result phase');
      report(b3Modal?.querySelectorAll('.number-card').length === 0, 'Beat 3 Result modal shows zero number cards');
      report(b3Modal?.querySelectorAll('.rm-pitch-showcase-tile').length === 2, 'Beat 3 Result modal displays the two pitch tiles');
      report(b3Modal?.querySelector('.rm-target-highlight') !== null, 'Beat 3 Result modal displays new target number');
      report(b3Modal?.querySelector('.rm-target-highlight .rm-th-number')?.textContent.trim() === '4', 'Target highlight reflects base target 4');

      // Test proceedToBeat4()
      let b4Updates = null;
      window.db = {
        ref: () => ({
          once: (evt, cb) => {
            const snap = { val: () => soloPlayState };
            cb(snap);
            return Promise.resolve(snap);
          },
          update: (u) => {
            b4Updates = u;
            return Promise.resolve();
          }
        })
      };
      proceedToBeat4();
      report(b4Updates !== null, 'proceedToBeat4 executed gameRef.update()');
      report(b4Updates?.['currentPA/phase'] === 'placing', 'proceedToBeat4 transitions phase to placing');
      report(b4Updates?.['currentPA/beat'] === 'beat4', 'proceedToBeat4 transitions beat to beat4');
      window.db = undefined;

      // 13. Test Beat 4 Placing (Execution Clash on Payoff Pitch)
      soloPlayState.currentPA.phase = 'placing';
      soloPlayState.currentPA.beat = 'beat4';
      soloPlayState.currentPA.committed = { host: false, guest: false };
      handleGameState(soloPlayState);
      const b4Html = document.getElementById('app').innerHTML;
      report(b4Html.length > 100, `Beat 4 placing rendered successfully (${b4Html.length} chars)`);
      report(document.querySelector('.b2-target-showcase') !== null, 'Beat 4 renders execution clash target showcase');
      report(b4Html.includes('BREAKING'), 'Beat 4 displays established pitch from Beat 3 (BREAKING)');
      report(document.querySelector('.b2-card-slot') !== null, 'Beat 4 renders execution card slot');
      const b4PlayableCards = document.querySelectorAll('.hand-cards-container .number-card.active');
      report(b4PlayableCards.length > 0, `Beat 4 hand cards are playable for execution clash (found ${b4PlayableCards.length})`);

    } catch(e) {
      const p = document.createElement('p');
      p.className = 'fail';
      p.textContent = `[FAIL] ${e.message}`;
      document.getElementById('test-results').appendChild(p);
    }
  </script>
</body>
</html>
